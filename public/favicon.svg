<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#090d26" />
      <stop offset="100%" stop-color="#050816" />
    </radialGradient>
    <linearGradient id="arjunaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.3" />

  <!-- Arjuna Stylized "A" Crest -->
  <g filter="url(#glow)">
    <!-- Left Leg -->
    <path d="M 160 400 L 236 120 C 240 106, 272 106, 276 120 L 352 400 C 356 414, 336 424, 324 412 L 284 350 L 228 350 L 188 412 C 176 424, 156 414, 160 400 Z" fill="url(#arjunaGrad)" />
    
    <!-- Crossbar Glow Star -->
    <polygon points="256,180 266,220 306,230 266,240 256,280 246,240 206,230 246,220" fill="url(#sparkGrad)" />
  </g>
</svg>
